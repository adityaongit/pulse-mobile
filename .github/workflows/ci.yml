# Every pull request and every push to main runs the checks AGENTS.md asks for before a commit, plus the bundle check.
# The job name ("checks") is the required status check in .github/rulesets/main.json.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI never writes to the repo, and fork PRs get no secrets anyway.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `expo start` writes this gitignored file locally; without its `expo/types` the CSS animation styles do not type.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Metro builds the Android bundle: catches babel, metro and app.json breaks without a native build.
      - name: bundle check
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/bundle"

  # The widget and workout modules' Robolectric tests. android/ is generated (CNG), so prebuild first.
  native-tests:
    name: native tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Robolectric's Android SDK 36 runtime needs JDK 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      # The ubuntu image ships the Android SDK at this path; keep ANDROID_HOME set even if the image stops exporting it.
      - run: echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - run: ./gradlew :pulse-widgets:testDebugUnitTest :pulse-workouts:testDebugUnitTest --console=plain
        working-directory: android
